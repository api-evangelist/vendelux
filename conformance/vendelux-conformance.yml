domain_standards:
- id: null
  note: >-
    REWARD-ONLY and legitimately empty. The B2B event-intelligence / event-marketing market has no
    established machine-readable domain standard for event, attendee or exhibitor data that a
    contract could declare (there is no SCIM/OData/OpenRTB/HL7 equivalent for this sector). Vendelux
    is not penalised for the absence, and none is invented to fill the slot.
