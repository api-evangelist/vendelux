pricing_disclosure_note: >-
  Vendelux publishes three named tiers with itemised feature and quota inclusions, but publishes NO
  price, currency or billing period for any of them. Every tier routes to a "Talk to sales" / demo
  request. A buyer cannot determine cost, and an agent cannot compare Vendelux on price, without a
  sales conversation. plan_count is 3 because three real tiers are published; the money is what is
  missing.
api_access_in_any_plan: false
api_access_note: >-
  No tier lists API access, developer access, an API key allowance, or a call quota as an included
  feature. The only programmatic capability sold is the Salesforce/HubSpot CRM integration, which is
  Vendelux connecting outbound into the customer's CRM.
