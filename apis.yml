aid: vendelux
name: Vendelux
description: >-
  Vendelux is an AI-native event marketing and B2B event intelligence platform that helps
  go-to-market teams decide which conferences and trade shows to attend, pre-book qualified
  meetings before an event starts, and attribute pipeline back to specific events. It maintains a
  proprietary database of 250,000+ global B2B events, enriched from first-party conference-organizer
  feeds and monitoring of 185,000+ sources, and pushes attendee, lead and ROI data into customer
  CRMs. Product surfaces are Event Discovery, Meetings, Segments/List Builder and CRM Integration
  (Salesforce and HubSpot). Founded in 2021 by Alex Reynolds and Stefan Deeran, headquartered in
  New York City, and backed by FirstMark Capital, Cervin Ventures, Tenacity Ventures and Tri-Valley
  Ventures. Vendelux publishes no public developer API: as of this profile its programmatic surface
  consists of OAuth connections Vendelux makes INTO a customer's Salesforce or HubSpot tenant, not
  an API, SDK, webhook catalog or machine-readable contract it exposes to developers.
