source: >-
  Live HTTP probes of the named /.well-known/ path list against every Vendelux host that resolves
  in DNS. Nothing was served: vendelux.com answers every /.well-known/* path with an nginx 403 (the
  path is blocked at the edge, not a Cloudflare interstitial), api.vendelux.com answers every path
  with a Cloudflare origin 502, and developers.vendelux.com (a WordPress engineering blog) answers
  with its WordPress 404 template. No WellKnown or SecurityTxt pointer is emitted, because no path
  returned a 200 carrying a real document.
note: >-
  Vendelux serves no /.well-known/ documents of any kind — no security.txt, no api-catalog, no
  OAuth/OIDC metadata, no agent card, no ai-plugin manifest. This is consistent with the rest of the
  profile: Vendelux publishes no developer API, so there is no authorization server or API catalog to
  advertise. api.vendelux.com is a real DNS record (Cloudflare-proxied A records, no CNAME) whose
  origin returned HTTP 502 for every path probed on 2026-09-02, so it could not be characterised.
